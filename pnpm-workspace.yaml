# pnpm audit --audit-level=high fails on two advisories that only arrive through
# the Prisma CLI's own dependencies (Prisma bundles MySQL support we never use):
#   GHSA-3f6p-5ww8-9rcr / GHSA-rgwj-5xj2-c3m3 -> mysql2
#   GHSA-ggr8-5vv4-36mx                  -> deepmerge-ts
# Pinned forward to the patched releases rather than ignored.
overrides:
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0

allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: false
  unrs-resolver: false
